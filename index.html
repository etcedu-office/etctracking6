<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ระบบติดตามวิทยานิพนธ์และการศึกษาค้นคว้าอิสระ - ภาควิชาเทคโนโลยีและสื่อสารการศึกษา คณะศึกษาศาสตร์ มหาวิทยาลัยมหาสารคาม">
  <title>ระบบติดตามวิทยานิพนธ์ | มหาวิทยาลัยมหาสารคาม</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%234A148C' d='M12 2L1 7l11 5 9-4.09V17h2V7L12 2zM3 9.27v6L12 20l9-4.73v-6L12 14 3 9.27z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       CSS VARIABLES - Design Tokens
       โทนสี: กรมท่า (น้ำเงินเข้ม) ขาว เหลืองมหาวิทยาลัย ม่วง Action
       ============================================================ */
    :root {
      --color-primary: #1A237E;       /* กรมท่า */
      --color-primary-dark: #0D1444;
      --color-primary-light: #3949AB;
      --color-accent: #4A148C;        /* ม่วง - Action */
      --color-accent-light: #7B1FA2;
      --color-yellow: #FFC107;        /* เหลืองมหาวิทยาลัย */
      --color-yellow-dark: #FFA000;
      --color-bg: #F5F7FA;
      --color-surface: #FFFFFF;
      --color-surface-alt: #FAFBFD;
      --color-border: #E1E5EB;
      --color-text: #1F2937;
      --color-text-secondary: #6B7280;
      --color-text-muted: #9CA3AF;
      --color-success: #16A34A;
      --color-success-bg: #DCFCE7;
      --color-warning: #D97706;
      --color-warning-bg: #FEF3C7;
      --color-danger: #DC2626;
      --color-danger-bg: #FEE2E2;
      --color-info: #0284C7;
      --color-info-bg: #E0F2FE;

      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);

      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;

      --transition: 200ms cubic-bezier(0.4, 0, 0.2, 1);

      --font-family: 'Sarabun', 'Noto Sans Thai', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

      --sidebar-width: 260px;
      --header-height: 64px;
    }

    /* ============================================================
       RESET & BASE
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      font-family: var(--font-family);
      font-size: 15px;
      line-height: 1.6;
      color: var(--color-text);
      background: var(--color-bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    button, input, select, textarea { font-family: inherit; font-size: inherit; }
    button { cursor: pointer; border: none; background: none; }
    a { color: var(--color-accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    img, svg { display: block; max-width: 100%; }
    ul, ol { list-style: none; }
    table { border-collapse: collapse; width: 100%; }

    /* ============================================================
       FOCUS & ACCESSIBILITY
       ============================================================ */
    :focus-visible {
      outline: 3px solid var(--color-accent-light);
      outline-offset: 2px;
    }
    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    /* ============================================================
       LAYOUT
       ============================================================ */
    .app { display: flex; min-height: 100vh; }
    .sidebar {
      width: var(--sidebar-width);
      background: linear-gradient(180deg, var(--color-primary-dark) 0%, var(--color-primary) 100%);
      color: #fff;
      position: fixed; top: 0; left: 0; bottom: 0;
      display: flex; flex-direction: column;
      z-index: 100;
      transition: transform var(--transition);
      overflow-y: auto;
    }
    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .sidebar-logo {
      display: flex; align-items: center; gap: 12px;
      font-weight: 700; font-size: 16px;
    }
    .sidebar-logo svg { width: 32px; height: 32px; fill: var(--color-yellow); }
    .sidebar-subtitle {
      font-size: 12px; opacity: 0.7; margin-top: 4px;
    }
    .nav { flex: 1; padding: 16px 12px; }
    .nav-section { margin-bottom: 20px; }
    .nav-section-title {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
      color: rgba(255,255,255,0.5); padding: 8px 12px 4px; font-weight: 600;
    }
    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px; border-radius: var(--radius-md);
      color: rgba(255,255,255,0.85); font-size: 14px;
      cursor: pointer; transition: background var(--transition);
      text-align: left; width: 100%;
    }
    .nav-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .nav-item.active {
      background: var(--color-yellow); color: var(--color-primary-dark);
      font-weight: 600;
    }
    .nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }
    .nav-item.active svg { fill: var(--color-primary-dark); }

    .main {
      flex: 1; margin-left: var(--sidebar-width);
      display: flex; flex-direction: column; min-width: 0;
    }
    .header {
      height: var(--header-height);
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; position: sticky; top: 0; z-index: 50;
    }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .menu-toggle {
      display: none; width: 40px; height: 40px;
      border-radius: var(--radius-md); align-items: center; justify-content: center;
    }
    .menu-toggle:hover { background: var(--color-bg); }
    .menu-toggle svg { width: 24px; height: 24px; stroke: var(--color-text); }
    .page-title { font-size: 18px; font-weight: 600; }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .user-chip {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 12px; border-radius: var(--radius-md);
      background: var(--color-surface-alt); border: 1px solid var(--color-border);
    }
    .user-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--color-accent); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 13px;
    }
    .user-info { display: flex; flex-direction: column; font-size: 13px; line-height: 1.3; }
    .user-name { font-weight: 600; }
    .user-role {
      font-size: 11px; color: var(--color-text-secondary);
      padding: 2px 6px; border-radius: var(--radius-sm);
      background: var(--color-yellow); color: var(--color-primary-dark);
      display: inline-block; font-weight: 600; margin-top: 2px;
    }

    .content { flex: 1; padding: 24px; max-width: 1600px; margin: 0 auto; width: 100%; }
    .content.hidden { display: none; }

    /* ============================================================
       BUTTONS
       ============================================================ */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; padding: 10px 18px;
      border-radius: var(--radius-md); font-weight: 500;
      font-size: 14px; transition: all var(--transition);
      border: 1px solid transparent; white-space: nowrap;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-primary {
      background: var(--color-accent); color: #fff;
    }
    .btn-primary:hover:not(:disabled) { background: var(--color-accent-light); }
    .btn-secondary {
      background: var(--color-surface); color: var(--color-text);
      border-color: var(--color-border);
    }
    .btn-secondary:hover:not(:disabled) { background: var(--color-bg); border-color: var(--color-text-muted); }
    .btn-danger { background: var(--color-danger); color: #fff; }
    .btn-danger:hover:not(:disabled) { background: #B91C1C; }
    .btn-warning { background: var(--color-warning); color: #fff; }
    .btn-success { background: var(--color-success); color: #fff; }
    .btn-sm { padding: 6px 12px; font-size: 13px; }
    .btn-lg { padding: 12px 24px; font-size: 16px; }
    .btn-block { width: 100%; }
    .btn-icon { padding: 8px; width: 36px; height: 36px; }
    .btn-icon svg { width: 18px; height: 18px; }

    /* ============================================================
       CARDS
       ============================================================ */
    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      transition: box-shadow var(--transition);
    }
    .card:hover { box-shadow: var(--shadow-md); }
    .card-header {
      padding: 16px 20px; border-bottom: 1px solid var(--color-border);
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px;
    }
    .card-title { font-size: 16px; font-weight: 600; }
    .card-body { padding: 20px; }
    .card-footer {
      padding: 12px 20px; border-top: 1px solid var(--color-border);
      background: var(--color-surface-alt); border-radius: 0 0 var(--radius-lg) var(--radius-lg);
    }

    /* ============================================================
       STATS CARDS (Dashboard)
       ============================================================ */
    .stats-grid {
      display: grid; gap: 16px;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    }
    .stat-card {
      background: var(--color-surface); padding: 20px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-border);
      position: relative; overflow: hidden;
    }
    .stat-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
      background: var(--color-primary);
    }
    .stat-card.warning::before { background: var(--color-warning); }
    .stat-card.success::before { background: var(--color-success); }
    .stat-card.danger::before { background: var(--color-danger); }
    .stat-card.info::before { background: var(--color-info); }
    .stat-label { font-size: 13px; color: var(--color-text-secondary); margin-bottom: 6px; }
    .stat-value { font-size: 32px; font-weight: 700; color: var(--color-text); line-height: 1.2; }
    .stat-icon {
      position: absolute; top: 16px; right: 16px;
      width: 40px; height: 40px; border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      background: var(--color-bg); opacity: 0.7;
    }
    .stat-icon svg { width: 24px; height: 24px; }

    /* ============================================================
       TABLE
       ============================================================ */
    .table-wrapper {
      overflow-x: auto; border-radius: var(--radius-md);
      -webkit-overflow-scrolling: touch;
    }
    table.data-table {
      width: 100%; min-width: 800px;
    }
    table.data-table th {
      background: var(--color-primary); color: #fff;
      padding: 12px 14px; text-align: left; font-weight: 600;
      font-size: 13px; white-space: nowrap;
      position: sticky; top: 0;
    }
    table.data-table td {
      padding: 12px 14px; border-bottom: 1px solid var(--color-border);
      font-size: 14px; vertical-align: middle;
    }
    table.data-table tbody tr:hover { background: var(--color-surface-alt); }
    table.data-table tbody tr:last-child td { border-bottom: none; }
    .table-tools {
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
      margin-bottom: 16px;
    }

    /* ============================================================
       FORMS
       ============================================================ */
    .form-group { margin-bottom: 16px; }
    .form-row {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px;
    }
    .form-label {
      display: block; font-size: 13px; font-weight: 500;
      margin-bottom: 6px; color: var(--color-text);
    }
    .form-label .required { color: var(--color-danger); }
    .form-control {
      width: 100%; padding: 10px 12px;
      border: 1px solid var(--color-border); border-radius: var(--radius-md);
      font-size: 14px; transition: border-color var(--transition), box-shadow var(--transition);
      background: var(--color-surface); color: var(--color-text);
    }
    .form-control:focus {
      outline: none; border-color: var(--color-accent);
      box-shadow: 0 0 0 3px rgba(74,20,140,0.1);
    }
    .form-control:disabled { background: var(--color-bg); cursor: not-allowed; }
    textarea.form-control { min-height: 90px; resize: vertical; }
    select.form-control { cursor: pointer; }
    .form-help { font-size: 12px; color: var(--color-text-secondary); margin-top: 4px; }
    .form-error { font-size: 12px; color: var(--color-danger); margin-top: 4px; }
    .form-control.invalid { border-color: var(--color-danger); }

    /* ============================================================
       BADGES
       ============================================================ */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 999px;
      font-size: 12px; font-weight: 600;
    }
    .badge-success { background: var(--color-success-bg); color: var(--color-success); }
    .badge-warning { background: var(--color-warning-bg); color: var(--color-warning); }
    .badge-danger { background: var(--color-danger-bg); color: var(--color-danger); }
    .badge-info { background: var(--color-info-bg); color: var(--color-info); }
    .badge-default { background: var(--color-bg); color: var(--color-text-secondary); }
    .badge-purple { background: rgba(74,20,140,0.1); color: var(--color-accent); }

    /* ============================================================
       MODAL
       ============================================================ */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 200; padding: 16px; opacity: 0; pointer-events: none;
      transition: opacity var(--transition);
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal {
      background: var(--color-surface); border-radius: var(--radius-lg);
      width: 100%; max-width: 600px; max-height: 90vh;
      overflow-y: auto; box-shadow: var(--shadow-lg);
      transform: translateY(20px); transition: transform var(--transition);
    }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal.modal-lg { max-width: 900px; }
    .modal-header {
      padding: 16px 20px; border-bottom: 1px solid var(--color-border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-title { font-size: 18px; font-weight: 600; }
    .modal-close {
      width: 32px; height: 32px; border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
    }
    .modal-close:hover { background: var(--color-bg); }
    .modal-body { padding: 20px; }
    .modal-footer {
      padding: 12px 20px; border-top: 1px solid var(--color-border);
      display: flex; gap: 8px; justify-content: flex-end;
      background: var(--color-surface-alt);
    }

    /* ============================================================
       TOAST
       ============================================================ */
    .toast-container {
      position: fixed; top: 20px; right: 20px; z-index: 300;
      display: flex; flex-direction: column; gap: 8px;
      max-width: 360px;
    }
    .toast {
      background: var(--color-surface); border-radius: var(--radius-md);
      padding: 12px 16px; box-shadow: var(--shadow-lg);
      display: flex; align-items: flex-start; gap: 10px;
      border-left: 4px solid var(--color-info);
      animation: slideIn var(--transition);
    }
    .toast.success { border-left-color: var(--color-success); }
    .toast.error { border-left-color: var(--color-danger); }
    .toast.warning { border-left-color: var(--color-warning); }
    .toast-icon { width: 20px; height: 20px; flex-shrink: 0; }
    .toast-content { flex: 1; }
    .toast-title { font-weight: 600; font-size: 14px; }
    .toast-message { font-size: 13px; color: var(--color-text-secondary); margin-top: 2px; }
    @keyframes slideIn {
      from { transform: translateX(120%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* ============================================================
       LOADING & STATES
       ============================================================ */
    .spinner {
      width: 20px; height: 20px; border: 2px solid var(--color-border);
      border-top-color: var(--color-accent); border-radius: 50%;
      animation: spin 0.8s linear infinite; display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-overlay {
      position: fixed; inset: 0; background: rgba(255,255,255,0.7);
      display: flex; align-items: center; justify-content: center;
      z-index: 250;
    }
    .loading-overlay .spinner { width: 40px; height: 40px; border-width: 3px; }

    .skeleton {
      background: linear-gradient(90deg, var(--color-bg) 25%, var(--color-border) 50%, var(--color-bg) 75%);
      background-size: 200% 100%;
      animation: skeleton 1.5s infinite;
      border-radius: var(--radius-sm);
    }
    @keyframes skeleton {
      from { background-position: 200% 0; }
      to { background-position: -200% 0; }
    }
    .skeleton-line { height: 14px; margin-bottom: 8px; }
    .skeleton-line.short { width: 60%; }
    .skeleton-block { height: 100px; }

    .empty-state, .error-state {
      text-align: center; padding: 40px 20px; color: var(--color-text-secondary);
    }
    .empty-state svg, .error-state svg {
      width: 64px; height: 64px; margin: 0 auto 16px; opacity: 0.4;
    }
    .empty-state h3, .error-state h3 {
      font-size: 16px; color: var(--color-text); margin-bottom: 4px;
    }

    /* ============================================================
       LOGIN PAGE
       ============================================================ */
    .login-page {
      min-height: 100vh; display: flex;
      background: linear-gradient(135deg, var(--color-primary-dark) 0%, var(--color-primary) 50%, var(--color-accent) 100%);
      align-items: center; justify-content: center; padding: 20px;
    }
    .login-card {
      background: var(--color-surface); border-radius: var(--radius-xl);
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.4);
      width: 100%; max-width: 440px; overflow: hidden;
    }
    .login-header {
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-accent) 100%);
      color: #fff; padding: 32px 24px; text-align: center;
    }
    .login-header svg { width: 56px; height: 56px; margin: 0 auto 12px; fill: var(--color-yellow); }
    .login-header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .login-header p { font-size: 13px; opacity: 0.9; }
    .login-body { padding: 28px 24px; }
    .login-footer {
      padding: 16px 24px; background: var(--color-surface-alt);
      border-top: 1px solid var(--color-border);
      font-size: 12px; text-align: center; color: var(--color-text-secondary);
    }
    .login-divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0; color: var(--color-text-muted); font-size: 12px;
    }
    .login-divider::before, .login-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--color-border);
    }

    /* ============================================================
       PROGRESS TIMELINE
       ============================================================ */
    .timeline {
      display: flex; gap: 0; align-items: flex-start;
      overflow-x: auto; padding-bottom: 12px;
    }
    .timeline-step {
      flex: 1; min-width: 180px; position: relative;
      padding-left: 28px;
    }
    .timeline-step::before {
      content: ''; position: absolute; left: 12px; top: 24px; bottom: -20px;
      width: 2px; background: var(--color-border);
    }
    .timeline-step:last-child::before { display: none; }
    .timeline-dot {
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--color-border); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; margin-bottom: 8px;
      position: absolute; left: 0; top: 0;
    }
    .timeline-step.completed .timeline-dot { background: var(--color-success); }
    .timeline-step.in-progress .timeline-dot { background: var(--color-warning); }
    .timeline-step.pending .timeline-dot { background: var(--color-border); color: var(--color-text-muted); }
    .timeline-content { padding-left: 36px; padding-bottom: 24px; }
    .timeline-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
    .timeline-meta { font-size: 12px; color: var(--color-text-secondary); }

    .progress-bar-wrapper {
      background: var(--color-bg); border-radius: 999px;
      height: 8px; overflow: hidden; margin: 12px 0;
    }
    .progress-bar {
      height: 100%; background: linear-gradient(90deg, var(--color-success), var(--color-warning));
      border-radius: 999px; transition: width 0.5s;
    }

    /* ============================================================
       GRID UTILITIES
       ============================================================ */
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .flex { display: flex; }
    .flex-col { display: flex; flex-direction: column; }
    .flex-wrap { flex-wrap: wrap; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .gap-4 { gap: 16px; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .justify-end { justify-content: flex-end; }
    .mt-2 { margin-top: 8px; } .mt-3 { margin-top: 12px; } .mt-4 { margin-top: 16px; }
    .mb-2 { margin-bottom: 8px; } .mb-3 { margin-bottom: 12px; } .mb-4 { margin-bottom: 16px; }
    .text-center { text-align: center; }
    .text-sm { font-size: 13px; }
    .text-muted { color: var(--color-text-secondary); }

/* ============================================================
   UTILITIES
   ============================================================ */
const UTIL = {
  uuid() {
    if (crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      const v = c === 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  },
  formatDate(d) {
    if (!d) return '-';
    const date = new Date(d);
    if (isNaN(date)) return d;
    const day = String(date.getDate()).padStart(2, '0');
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const year = date.getFullYear();
    return `${day}/${month}/${year}`;
  },
  formatDateTime(d) {
    if (!d) return '-';
    const date = new Date(d);
    if (isNaN(date)) return d;
    return UTIL.formatDate(d) + ' ' + String(date.getHours()).padStart(2,'0') + ':' + String(date.getMinutes()).padStart(2,'0');
  },
  formatFileSize(bytes) {
    if (!bytes) return '0 B';
    const units = ['B', 'KB', 'MB', 'GB'];
    let i = 0;
    while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
    return bytes.toFixed(1) + ' ' + units[i];
  },
  escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  },
  debounce(fn, delay) {
    let t;
    return function(...args) {
      clearTimeout(t);
      t = setTimeout(() => fn.apply(this, args), delay);
    };
  },
  storeToken(token) {
    if (token) localStorage.setItem(CONFIG.TOKEN_KEY, token);
    else localStorage.removeItem(CONFIG.TOKEN_KEY);
  },
  getToken() {
    return localStorage.getItem(CONFIG.TOKEN_KEY);
  },
  storeUser(user) {
    if (user) localStorage.setItem(CONFIG.USER_KEY, JSON.stringify(user));
    else localStorage.removeItem(CONFIG.USER_KEY);
  },
  getStoredUser() {
    try { return JSON.parse(localStorage.getItem(CONFIG.USER_KEY)); }
    catch(e) { return null; }
  }
};

/* ============================================================
   TOAST
   ============================================================ */
const Toast = {
  show(message, type = 'info', title = '') {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = 'toast ' + type;
    const icons = {
      success: '<svg class="toast-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>',
      error: '<svg class="toast-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>',
      warning: '<svg class="toast-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>',
      info: '<svg class="toast-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>'
    };
    toast.innerHTML = `${icons[type] || icons.info}<div class="toast-content"><div class="toast-title">${UTIL.escapeHtml(title || type)}</div><div class="toast-message">${UTIL.escapeHtml(message)}</div></div>`;
    container.appendChild(toast);
    setTimeout(() => {
      toast.style.animation = 'slideIn 0.3s reverse';
      setTimeout(() => toast.remove(), 300);
    }, 4000);
  },
  success(msg, title) { this.show(msg, 'success', title || 'สำเร็จ'); },
  error(msg, title) { this.show(msg, 'error', title || 'เกิดข้อผิดพลาด'); },
  warning(msg, title) { this.show(msg, 'warning', title || 'คำเตือน'); },
  info(msg, title) { this.show(msg, 'info', title || 'แจ้งเตือน'); }
};

/* ============================================================
   MODAL
   ============================================================ */
const Modal = {
  open({ title, body, footer, size }) {
    const container = document.getElementById('modal-container');
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const modal = document.createElement('div');
    modal.className = 'modal' + (size === 'lg' ? ' modal-lg' : '');
    modal.innerHTML = `
      <div class="modal-header">
        <h3 class="modal-title">${title}</h3>
        <button class="modal-close" data-action="close" aria-label="ปิด">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <div class="modal-body">${body}</div>
      ${footer ? `<div class="modal-footer">${footer}</div>` : ''}
    `;
    overlay.appendChild(modal);
    container.appendChild(overlay);
    requestAnimationFrame(() => overlay.classList.add('open'));

    overlay.addEventListener('click', e => {
      if (e.target === overlay || e.target.closest('[data-action="close"]')) {
        Modal.close(overlay);
      }
    });
    document.addEventListener('keydown', function esc(e) {
      if (e.key === 'Escape') {
        Modal.close(overlay);
        document.removeEventListener('keydown', esc);
      }
    });
    return overlay;
  },
  close(overlay) {
    if (!overlay) overlay = document.querySelector('.modal-overlay');
    if (!overlay) return;
    overlay.classList.remove('open');
    setTimeout(() => overlay.remove(), 200);
  },
  confirm({ title, message, confirmText, confirmClass, onConfirm }) {
    const overlay = Modal.open({
      title: title || 'ยืนยันการดำเนินการ',
      body: `<p>${UTIL.escapeHtml(message)}</p>`,
      footer: `
        <button class="btn btn-secondary" data-action="close">ยกเลิก</button>
        <button class="btn ${confirmClass || 'btn-danger'}" data-action="confirm">${confirmText || 'ยืนยัน'}</button>
      `
    });
    overlay.querySelector('[data-action="confirm"]').addEventListener('click', () => {
      Modal.close(overlay);
      if (onConfirm) onConfirm();
    });
  }
};

/* ============================================================
   API
   ============================================================ */
const API = {
  async request(action, data = {}, method = 'POST') {
    // DEMO_MODE: จำลอง response จาก DEMO_DATA
    if (CONFIG.DEMO_MODE) {
      return API.demoRequest(action, data);
    }

    if (!CONFIG.API_URL) {
      Toast.error('ยังไม่ได้ตั้งค่า API_URL ใน CONFIG');
      throw new Error('API_URL not configured');
    }

    const token = UTIL.getToken();
    const payload = Object.assign({ action, token }, data);

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), CONFIG.API_TIMEOUT_MS);

    try {
      const response = await fetch(CONFIG.API_URL, {
        method: method,
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload),
        signal: controller.signal
      });
      clearTimeout(timeout);
      if (!response.ok) {
        throw new Error('HTTP ' + response.status + ': ' + response.statusText);
      }
      const result = await response.json();
      if (!result.success) {
        Toast.error(result.message || 'เกิดข้อผิดพลาด');
      }
      return result;
    } catch (err) {
      clearTimeout(timeout);
      if (err.name === 'AbortError') {
        Toast.error('คำขอหมดเวลา กรุณาลองอีกครั้ง');
        throw new Error('Request timeout');
      }
      Toast.error('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้: ' + err.message);
      throw err;
    }
  },

  // จำลอง response สำหรับ DEMO_MODE
  async demoRequest(action, data) {
    await new Promise(r => setTimeout(r, 300));
    const user = STATE.currentUser;
    const isAdmin = user && (user.role === 'ADMIN' || user.role === 'SUPER_ADMIN');
    const isStudent = user && user.role === 'STUDENT';
    const isAdvisor = user && user.role === 'ADVISOR';

    const handlers = {
      login: () => {
        const found = DEMO_DATA.users.find(u => u.email === data.email);
        if (!found) return { success: false, message: 'ไม่พบบัญชีผู้ใช้', errorCode: 'USER_NOT_FOUND' };
        return {
          success: true,
          message: 'เข้าสู่ระบบสำเร็จ',
          data: {
            token: 'demo_token_' + Date.now(),
            expiresAt: new Date(Date.now() + 120*60000).toISOString(),
            user: { id: found.id, email: found.email, displayName: found.displayName, role: found.role, studentId: found.studentId || '', advisorId: found.advisorId || '', status: found.status }
          }
        };
      },
      getDashboard: () => {
        let students = DEMO_DATA.students;
        if (isStudent) students = students.filter(s => s.id === user.studentId);
        else if (isAdvisor) students = students.filter(s => s.advisorId === user.advisorId);
        const now = new Date();
        return {
          success: true,
          data: {
            stats: {
              totalStudents: students.length,
              inProgress: students.filter(s => s.status === 'IN_PROGRESS').length,
              pendingDefense: students.filter(s => s.status === 'PENDING_DEFENSE').length,
              completed: students.filter(s => s.status === 'COMPLETED').length,
              overdue: students.filter(s => s.expectedEndDate && new Date(s.expectedEndDate) < now && s.status !== 'COMPLETED').length,
              documentsPending: 0,
              logbooksPendingReview: DEMO_DATA.logbooks.filter(l => l.status === 'PENDING').length
            },
            stepDistribution: PROGRESS_STEPS.map(st => ({
              step: st.step, nameTh: st.nameTh,
              count: students.filter(s => Number(s.currentStep) === st.step).length
            })),
            recentActivities: DEMO_DATA.auditLogs.slice(0, 5)
          }
        };
      },
      listStudents: () => {
        let students = [...DEMO_DATA.students];
        if (isStudent) students = students.filter(s => s.id === user.studentId);
        else if (isAdvisor) students = students.filter(s => s.advisorId === user.advisorId);
        if (data.search) {
          const q = data.search.toLowerCase();
          students = students.filter(s =>
            s.studentCode.toLowerCase().includes(q) ||
            s.firstNameTh.toLowerCase().includes(q) ||
            s.lastNameTh.toLowerCase().includes(q)
          );
        }
        if (data.status) students = students.filter(s => s.status === data.status);
        if (data.degreeLevel) students = students.filter(s => s.degreeLevel === data.degreeLevel);
        if (data.currentStep) students = students.filter(s => String(s.currentStep) === String(data.currentStep));
        const total = students.length;
        const page = Number(data.page || 1);
        const pageSize = Number(data.pageSize || CONFIG.PAGE_SIZE);
        const start = (page - 1) * pageSize;
        const advisorMap = {};
        DEMO_DATA.advisors.forEach(a => advisorMap[a.id] = a);
        const items = students.slice(start, start + pageSize).map(s => {
          const adv = advisorMap[s.advisorId];
          return Object.assign({}, s, {
            advisorName: adv ? (adv.titleTh + ' ' + adv.firstNameTh + ' ' + adv.lastNameTh) : ''
          });
        });
        return {
          success: true,
          data: {
            items,
            pagination: { page, pageSize, total, totalPages: Math.ceil(total / pageSize) }
          }
        };
      },
      getStudent: () => {
        const s = DEMO_DATA.students.find(x => x.id === data.id);
        if (!s) return { success: false, message: 'ไม่พบนิสิต' };
        const thesis = DEMO_DATA.theses.find(t => t.id === s.thesisId);
        const progress = DEMO_DATA.progress.filter(p => p.studentId === s.id);
        const logbooks = DEMO_DATA.logbooks.filter(l => l.studentId === s.id);
        const exams = DEMO_DATA.exams.filter(e => e.studentId === s.id);
        const documents = DEMO_DATA.documents.filter(d => d.studentId === s.id);
        return { success: true, data: { student: s, thesis, progress, logbooks, exams, documents } };
      },
      createStudent: () => {
        const id = UTIL.uuid();
        const newS = Object.assign({ id, currentStep: 1, status: 'IN_PROGRESS' }, data);
        DEMO_DATA.students.push(newS);
        return { success: true, message: 'เพิ่มนิสิตสำเร็จ', data: { id } };
      },
      updateStudent: () => {
        const s = DEMO_DATA.students.find(x => x.id === data.id);
        if (!s) return { success: false, message: 'ไม่พบนิสิต' };
        Object.assign(s, data);
        return { success: true, message: 'แก้ไขสำเร็จ' };
      },
      deleteStudent: () => {
        const idx = DEMO_DATA.students.findIndex(x => x.id === data.id);
        if (idx >= 0) DEMO_DATA.students.splice(idx, 1);
        return { success: true, message: 'ลบสำเร็จ' };
      },
      listAdvisors: () => {
        const advisors = DEMO_DATA.advisors.map(a => Object.assign({}, a));
        return { success: true, data: { items: advisors } };
      },
      createAdvisor: () => {
        const id = UTIL.uuid();
        DEMO_DATA.advisors.push(Object.assign({ id, currentCount: 0 }, data));
        return { success: true, message: 'เพิ่มอาจารย์สำเร็จ', data: { id } };
      },
      updateAdvisor: () => {
        const a = DEMO_DATA.advisors.find(x => x.id === data.id);
        if (!a) return { success: false, message: 'ไม่พบอาจารย์' };
        Object.assign(a, data);
        return { success: true, message: 'แก้ไขสำเร็จ' };
      },
      listProgress: () => {
        let items = DEMO_DATA.progress;
        if (data.studentId) items = items.filter(p => p.studentId === data.studentId);
        return { success: true, data: { items, steps: PROGRESS_STEPS } };
      },
      saveProgress: () => ({ success: true, message: 'บันทึกความก้าวหน้าสำเร็จ' }),
      listLogbooks: () => {
        let items = DEMO_DATA.logbooks;
        if (data.studentId) items = items.filter(l => l.studentId === data.studentId);
        if (isStudent) items = items.filter(l => l.studentId === user.studentId);
        return { success: true, data: { items } };
      },
      createLogbook: () => ({ success: true, message: 'สร้าง Logbook สำเร็จ', data: { id: UTIL.uuid() } }),
      reviewLogbook: () => ({ success: true, message: 'บันทึกผลการตรวจสำเร็จ' }),
      listExams: () => {
        let items = DEMO_DATA.exams;
        if (isStudent) items = items.filter(e => e.studentId === user.studentId);
        return { success: true, data: { items } };
      },
      createExam: () => ({ success: true, message: 'สร้างตารางสอบสำเร็จ', data: { id: UTIL.uuid() } }),
      updateExam: () => ({ success: true, message: 'แก้ไขตารางสอบสำเร็จ' }),
      recordExamResult: () => ({ success: true, message: 'บันทึกผลสอบสำเร็จ' }),
      listDocuments: () => {
        let items = DEMO_DATA.documents;
        if (data.studentId) items = items.filter(d => d.studentId === data.studentId);
        if (isStudent) items = items.filter(d => d.studentId === user.studentId);
        return { success: true, data: { items } };
      },
      listUsers: () => {
        let users = DEMO_DATA.users;
        if (user && user.role === 'ADMIN') users = users.filter(u => u.role !== 'SUPER_ADMIN');
        return { success: true, data: { items: users.map(u => ({ id: u.id, email: u.email, displayName: u.displayName, role: u.role, status: u.status, studentId: u.studentId || '', advisorId: u.advisorId || '' })) } };
      },
      createUser: () => ({ success: true, message: 'สร้างบัญชีสำเร็จ', data: { id: UTIL.uuid() } }),
      updateUserRole: () => ({ success: true, message: 'อัปเดตบทบาทสำเร็จ' }),

      healthCheck: () => ({ success: true, message: 'ระบบทำงานปกติ (DEMO)', data: { version: '1.0.0-demo' } })
    };

    const handler = handlers[action];
    if (!handler) return { success: false, message: 'ไม่รองรับ action ในโหมดสาธิต: ' + action };
    return handler();
  }
};

/* ============================================================
   AUTH
   ============================================================ */
const AUTH = {
  async login(email, password, googleSub) {
    const result = await API.request('login', { email, password, googleSub });
    if (result.success) {
      STATE.currentUser = result.data.user;
      STATE.currentToken = result.data.token;
      UTIL.storeToken(result.data.token);
      UTIL.storeUser(result.data.user);
    }
    return result;
  },

  async logout() {
    try {
      if (!CONFIG.DEMO_MODE && STATE.currentToken) {
        await API.request('logout', { token: STATE.currentToken });
      }
    } catch(e) { /* ignore */ }
    STATE.currentUser = null;
    STATE.currentToken = null;
    UTIL.storeToken(null);
    UTIL.storeUser(null);
    ROUTER.navigate('login');
  },

  async checkSession() {
    const token = UTIL.getToken();
    const stored = UTIL.getStoredUser();
    if (!token || !stored) return false;
    STATE.currentUser = stored;
    STATE.currentToken = token;
    if (!CONFIG.DEMO_MODE) {
      try {
        const result = await API.request('getSession', {}, 'POST');
        if (!result.success) {
          AUTH.logout();
          return false;
        }
        STATE.currentUser = result.data;
        UTIL.storeUser(result.data);
      } catch(e) {
        // อนุญาตให้ใช้ stored user ต่อถ้าเน็ตมีปัญหา
      }
    }
    return true;
  },

  hasRole(roles) {
    if (!STATE.currentUser) return false;
    if (typeof roles === 'string') roles = [roles];
    return roles.indexOf(STATE.currentUser.role) >= 0;
  },

  can(action) {
    if (!STATE.currentUser) return false;
    const role = STATE.currentUser.role;
    if (role === ROLES.SUPER_ADMIN) return true;
    const perms = {
      STUDENT: ['viewOwnStudent', 'viewDashboard', 'listStudents', 'getStudent', 'listLogbooks', 'createLogbook', 'listDocuments', 'uploadDocument', 'listExams', 'viewProgress'],
      ADVISOR: ['viewOwnStudent', 'viewDashboard', 'listStudents', 'getStudent', 'listLogbooks', 'reviewLogbook', 'listDocuments', 'listExams', 'viewProgress', 'saveProgress'],
      STAFF: ['viewOwnStudent', 'viewDashboard', 'listStudents', 'getStudent', 'createStudent', 'updateStudent', 'listAdvisors', 'listExams', 'createExam', 'updateExam', 'listDocuments', 'exportStudents', 'viewProgress'],
      ADMIN: ['viewOwnStudent', 'viewDashboard', 'listStudents', 'getStudent', 'createStudent', 'updateStudent', 'deleteStudent', 'listAdvisors', 'createAdvisor', 'updateAdvisor', 'listExams', 'createExam', 'updateExam', 'listDocuments', 'exportStudents', 'viewProgress', 'saveProgress', 'listUsers', 'getAuditLogs', 'getSettings'],
      SUPER_ADMIN: ['*']
    };
    const allowed = perms[role] || [];
    return allowed.indexOf('*') >= 0 || allowed.indexOf(action) >= 0;
  }
};

/* ============================================================
   VALIDATION
   ============================================================ */
const VALIDATION = {
  required(value) { return value !== null && value !== undefined && String(value).trim() !== ''; },
  email(value) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value); },
  minLength(value, n) { return String(value || '').length >= n; },
  maxLength(value, n) { return String(value || '').length <= n; },
  studentCode(value) { return /^[0-9]{7,8}$/.test(value); },
  phone(value) { return /^[0-9\-+\s]{9,15}$/.test(value); },

  validateForm(formEl, rules) {
    let valid = true;
    const errors = {};
    Object.keys(rules).forEach(field => {
      const input = formEl.querySelector(`[name="${field}"]`);
      const value = input ? input.value : '';
      const fieldRules = rules[field];
      for (const rule of fieldRules) {
        const { type, param, message } = rule;
        let ok = true;
        if (type === 'required') ok = VALIDATION.required(value);
        else if (type === 'email') ok = VALIDATION.email(value);
        else if (type === 'minLength') ok = VALIDATION.minLength(value, param);
        else if (type === 'maxLength') ok = VALIDATION.maxLength(value, param);
        else if (type === 'studentCode') ok = VALIDATION.studentCode(value);
        else if (type === 'phone') ok = VALIDATION.phone(value);
        if (!ok) {
          valid = false;
          errors[field] = message;
          if (input) input.classList.add('invalid');
          break;
        } else if (input) {
          input.classList.remove('invalid');
        }
      }
    });
    return { valid, errors };
  }
};

/* ============================================================
   ROUTER
   ============================================================ */
const ROUTER = {
  navigate(route, params = {}) {
    STATE.currentRoute = route;
    STATE.currentData = params;
    if (STATE.currentUser) {
      UI.render();
    } else {
      UI.renderLogin();
    }
  },

  getMenuItems() {
    const role = STATE.currentUser ? STATE.currentUser.role : '';
    const items = [
      { route: 'dashboard', label: 'Dashboard', icon: ICONS.dashboard, roles: ['STUDENT','ADVISOR','STAFF','ADMIN','SUPER_ADMIN'] },
      { route: 'students', label: 'รายชื่อนิสิต', icon: ICONS.student, roles: ['STUDENT','ADVISOR','STAFF','ADMIN','SUPER_ADMIN'] },
      { route: 'advisors', label: 'จัดการอาจารย์', icon: ICONS.advisor, roles: ['STAFF','ADMIN','SUPER_ADMIN'] },
      { route: 'logbook', label: 'Logbook', icon: ICONS.logbook, roles: ['STUDENT','ADVISOR','ADMIN','SUPER_ADMIN'] },
      { route: 'exams', label: 'ตารางสอบ', icon: ICONS.exam, roles: ['STUDENT','ADVISOR','STAFF','ADMIN','SUPER_ADMIN'] },
      { route: 'documents', label: 'เอกสาร', icon: ICONS.document, roles: ['STUDENT','ADVISOR','STAFF','ADMIN','SUPER_ADMIN'] },
      { route: 'users', label: 'ผู้ใช้และสิทธิ์', icon: ICONS.user, roles: ['ADMIN','SUPER_ADMIN'] },
      { route: 'audit', label: 'Audit Log', icon: ICONS.audit, roles: ['ADMIN','SUPER_ADMIN'] },
      { route: 'settings', label: 'ตั้งค่าระบบ', icon: ICONS.settings, roles: ['SUPER_ADMIN'] }
    ];
    return items.filter(item => item.roles.indexOf(role) >= 0);
  }
};

    document.getElementById('login-form').addEventListener('submit', async (e) => {

      if (!email) { Toast.error('กรุณาระบุอีเมล'); return; }

      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> กำลังเข้าสู่ระบบ...';

      try {
        const result = await AUTH.login(email, password);
        if (result.success) {
          Toast.success('ยินดีต้อนรับ ' + result.data.user.displayName);

        } else {
          Toast.error(result.message || 'เข้าสู่ระบบไม่สำเร็จ');

                <div class="user-info">

      });
    });
    document.getElementById('logout-btn').addEventListener('click', () => {

    const titles = {

      students: 'รายชื่อนิสิต',

      advisors: 'จัดการอาจารย์',
      logbook: 'Logbook - บันทึกความก้าวหน้า',
      exams: 'ตารางสอบ',
      documents: 'เอกสาร',
      users: 'จัดการผู้ใช้และสิทธิ์',
      audit: 'Audit Log',
      settings: 'ตั้งค่าระบบ'
    };
    return titles[STATE.currentRoute] || 'Dashboard';
  },

  renderContent() {
    const content = document.getElementById('content');
    if (!content) return;
    const route = STATE.currentRoute;
    if (route === 'dashboard') PAGES.dashboard(content);
    else if (route === 'students') PAGES.students(content);
    else if (route === 'studentDetail') PAGES.studentDetail(content);
    else if (route === 'advisors') PAGES.advisors(content);
    else if (route === 'logbook') PAGES.logbook(content);
    else if (route === 'exams') PAGES.exams(content);
    else if (route === 'documents') PAGES.documents(content);
    else if (route === 'users') PAGES.users(content);
    else if (route === 'audit') PAGES.audit(content);
    else if (route === 'settings') PAGES.settings(content);
    else PAGES.dashboard(content);
  }
};

                    <td>${UTIL.formatDate(s.startDate)}</td>

                      <div class="flex gap-2">

                        ${AUTH.can('updateStudent') ? `<button class="btn btn-icon btn-secondary btn-sm" data-action="edit" data-id="${s.id}" title="แก้ไข">${ICONS.edit}</button>` : ''}
                        ${AUTH.can('deleteStudent') ? `<button class="btn btn-icon btn-danger btn-sm" data-action="delete" data-id="${s.id}" title="ลบ">${ICONS.delete}</button>` : ''}

              ${Array.from({length: Math.min(pagination.totalPages, 5)}, (_,i) => i + 1).map(p => `
                <button class="${p === pagination.page ? 'active' : ''}" data-page="${p}">${p}</button>
              `).join('')}
              <button ${pagination.page >= pagination.totalPages ? 'disabled' : ''} data-page="${pagination.page + 1}">ถัดไป</button>
              <span class="pagination-info">หน้า ${pagination.page}/${pagination.totalPages} (ทั้งหมด ${pagination.total} รายการ)</span>
            </div>
          </div>
        </div>

      // Bind actions

      });
      area.querySelectorAll('[data-action="edit"]').forEach(btn => {

      area.querySelectorAll('[data-action="delete"]').forEach(btn => {

                }

            }
          });
        });
      });
      area.querySelectorAll('.pagination button[data-page]').forEach(btn => {
        btn.addEventListener('click', () => {
          STATE.pagination.page = Number(btn.dataset.page);
          PAGES.students_renderTable();

      area.innerHTML = `<div class="card"><div class="error-state">${ICONS.error}<h3>เกิดข้อผิดพลาด</h3><p>${UTIL.escapeHtml(err.message)}</p></div></div>`;
    }
  },

      footer: `
        <button class="btn btn-secondary" data-action="close">ยกเลิก</button>
        <button class="btn btn-primary" id="save-student-btn">${id ? 'บันทึกการแก้ไข' : 'เพิ่มนิสิต'}</button>
      `
    });

    document.getElementById('save-student-btn').addEventListener('click', async () => {
      const form = document.getElementById('student-form');
      const { valid, errors } = VALIDATION.validateForm(form, {
        studentCode: [{ type: 'required', message: 'กรุณาระบุรหัสนิสิต' }],
        firstNameTh: [{ type: 'required', message: 'กรุณาระบุชื่อ' }],
        lastNameTh: [{ type: 'required', message: 'กรุณาระบุนามสกุล' }],
        degreeLevel: [{ type: 'required', message: 'กรุณาระบุระดับปริญญา' }]
      });

        Toast.error(Object.values(errors)[0]);

      }

      const btn = document.getElementById('save-student-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> กำลังบันทึก...';

      try {

          Toast.success(result.message);
          Modal.close(overlay);

        Toast.error('บันทึกไม่สำเร็จ');
      } finally {
        btn.disabled = false;
        btn.innerHTML = id ? 'บันทึกการแก้ไข' : 'เพิ่มนิสิต';

  async exportStudents() {
    Loading.show();
    try {
      // เรียก listStudents ทั้งหมด
      const filters = STATE.filters.students || {};
      const result = await API.request('listStudents', Object.assign({}, filters, { page: 1, pageSize: 1000 }));
      if (!result.success) throw new Error(result.message);
      const items = result.data.items;

      const headers = ['รหัสนิสิต','คำนำหน้า','ชื่อ','นามสกุล','First Name','Last Name','อีเมล','เบอร์โทร','ระดับปริญญา','หลักสูตร','แผน','ปีการศึกษา','อาจารย์ที่ปรึกษา','ขั้นปัจจุบัน','สถานะ','วันที่เริ่ม','วันที่คาดสำเร็จ','วันที่สำเร็จจริง','หมายเหตุ'];
      const rows = [headers.join(',')];
      items.forEach(s => {
        const row = [s.studentCode, s.titleTh, s.firstNameTh, s.lastNameTh, s.firstNameEn, s.lastNameEn, s.email, s.phone, s.degreeLevel, s.program, s.studyPlan, s.academicYear, s.advisorName, s.currentStep, s.status, s.startDate, s.expectedEndDate, s.actualEndDate, (s.notes || '').replace(/[\n,]/g, ' ')];
        rows.push(row.map(v => {
          const str = String(v || '');
          if (str.indexOf(',') >= 0 || str.indexOf('"') >= 0) return '"' + str.replace(/"/g,'""') + '"';
          return str;
        }).join(','));
      });
      const csv = '\uFEFF' + rows.join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'students_export_' + new Date().toISOString().slice(0,10) + '.csv';
      a.click();
      URL.revokeObjectURL(url);
      Toast.success('ส่งออก CSV สำเร็จ (' + items.length + ' รายการ)');
    } catch(e) {
      Toast.error('ส่งออกไม่สำเร็จ: ' + e.message);
    } finally {
      Loading.hide();
    }
  },

  async progressForm(studentId, step, progressId) {
    const stepInfo = PROGRESS_STEPS[step - 1];
    let progress = null;
    if (progressId) {
      // ใน DEMO ดึงจาก DEMO_DATA
      progress = DEMO_DATA.progress.find(p => p.studentId === studentId && Number(p.step) === step);
    }

    const body = `
      <form id="progress-form">
        <p class="mb-3"><strong>ขั้นที่ ${step}: ${stepInfo.nameTh}</strong></p>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">สถานะ</label>
            <select name="status" class="form-control">
              <option value="PENDING" ${progress && progress.status === 'PENDING' ? 'selected' : ''}>รอดำเนินการ</option>
              <option value="IN_PROGRESS" ${(!progress || progress.status === 'IN_PROGRESS') ? 'selected' : ''}>กำลังดำเนินการ</option>
              <option value="COMPLETED" ${progress && progress.status === 'COMPLETED' ? 'selected' : ''}>เสร็จสิ้น</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">วันที่เริ่ม</label>
            <input type="date" name="startDate" class="form-control" value="${progress ? progress.startDate : ''}">
          </div>
          <div class="form-group">
            <label class="form-label">วันที่เสร็จ</label>
            <input type="date" name="completedDate" class="form-control" value="${progress ? progress.completedDate : ''}">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">หมายเหตุ</label>
          <textarea name="notes" class="form-control">${progress ? UTIL.escapeHtml(progress.notes || '') : ''}</textarea>
        </div>
      </form>
    `;

    const overlay = Modal.open({
      title: 'อัปเดตความก้าวหน้า',
      body,
      footer: `
        <button class="btn btn-secondary" data-action="close">ยกเลิก</button>
        <button class="btn btn-primary" id="save-progress">บันทึก</button>
      `
    });

    document.getElementById('save-progress').addEventListener('click', async () => {
      const form = document.getElementById('progress-form');
      const formData = new FormData(form);
      const data = { studentId, step, thesisId: '' };
      formData.forEach((v,k) => data[k] = v);

      const btn = document.getElementById('save-progress');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> กำลังบันทึก...';

      try {
        const result = await API.request('saveProgress', data);
        if (result.success) {
          Toast.success('บันทึกความก้าวหน้าสำเร็จ');
          Modal.close(overlay);
          UI.renderContent();
        } else {
          Toast.error(result.message);
        }
      } catch(e) {
        Toast.error('บันทึกไม่สำเร็จ');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'บันทึก';
      }
    });
  },

  async documentForm() {
    let students = [];
    try {
      const res = await API.request('listStudents', { page: 1, pageSize: 200 });
      if (res.success) students = res.data.items;
    } catch(e) {}

    const body = `
      <form id="doc-form" enctype="multipart/form-data">
        ${AUTH.hasRole('STUDENT') ? '' : `
          <div class="form-group">
            <label class="form-label">นิสิต <span class="required">*</span></label>
            <select name="studentId" class="form-control" required>
              <option value="">-- เลือก --</option>
              ${students.map(s => `<option value="${s.id}">${UTIL.escapeHtml(s.studentCode + ' - ' + s.firstNameTh + ' ' + s.lastNameTh)}</option>`).join('')}
            </select>
          </div>
        `}
        <div class="form-group">
          <label class="form-label">ประเภทเอกสาร</label>
          <select name="documentType" class="form-control">
            <option value="แบบเสนอหัวข้อ">แบบเสนอหัวข้อ</option>
            <option value="เค้าโครง">เค้าโครง</option>
            <option value="แบบประเมิน">แบบประเมิน</option>
            <option value="เล่มสมบูรณ์">เล่มสมบูรณ์</option>
            <option value="แก้ไข">ฉบับแก้ไข</option>
            <option value="อื่นๆ">อื่นๆ</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">ไฟล์ <span class="required">*</span></label>
          <input type="file" name="file" class="form-control" required>
          <div class="form-help">รองรับ PDF, DOC, DOCX, PPT, PPTX, JPG, PNG (สูงสุด 25 MB)</div>
        </div>
      </form>
    `;
    const overlay = Modal.open({
      title: 'อัปโหลดเอกสาร',
      body,
      footer: `
        <button class="btn btn-secondary" data-action="close">ยกเลิก</button>
        <button class="btn btn-primary" id="save-doc">อัปโหลด</button>
      `
    });
    document.getElementById('save-doc').addEventListener('click', async () => {
      const form = document.getElementById('doc-form');
      const fileInput = form.querySelector('[name="file"]');
      const file = fileInput.files[0];
      if (!file) { Toast.error('กรุณาเลือกไฟล์'); return; }
      const ext = file.name.split('.').pop().toLowerCase();
      const allowed = ['pdf','doc','docx','ppt','pptx','jpg','jpeg','png','xls','xlsx'];
      if (allowed.indexOf(ext) < 0) { Toast.error('ประเภทไฟล์ไม่ได้รับอนุญาต'); return; }
      if (file.size > 25 * 1024 * 1024) { Toast.error('ไฟล์ใหญ่เกิน 25 MB'); return; }

      const formData = new FormData(form);
      const data = { documentType: formData.get('documentType'), fileName: file.name, mimeType: file.type, fileSize: file.size };
      if (AUTH.hasRole('STUDENT') && STATE.currentUser.studentId) {
        data.studentId = STATE.currentUser.studentId;
      } else {
        data.studentId = formData.get('studentId');
      }
      if (!data.studentId) { Toast.error('กรุณาเลือกนิสิต'); return; }

      // แปลงไฟล์เป็น base64 สำหรับส่งไป API จริง
      if (!CONFIG.DEMO_MODE) {
        data.fileContent = await UTIL.fileToBase64(file);
      }

      const btn = document.getElementById('save-doc');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> กำลังอัปโหลด...';
      try {
        const result = await API.request('uploadDocument', data);
        if (result.success) {
          Toast.success(result.message);
          Modal.close(overlay);
          PAGES.documents_render();
        } else {
          Toast.error(result.message);
        }
      } catch(e) {
        Toast.error('อัปโหลดไม่สำเร็จ');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'อัปโหลด';
      }
    });
  },

      if (saveBtn) saveBtn.addEventListener('click', async () => {
        const form = document.getElementById('settings-form');
        const formData = new FormData(form);
        const data = {};
        formData.forEach((v,k) => data[k] = v);
        saveBtn.disabled = true;
        try {
          const result = await API.request('updateSettings', { settings: data });
          if (result.success) {
            Toast.success(result.message);
          }
        } catch(e) {
          Toast.error('บันทึกไม่สำเร็จ');
        } finally {
          saveBtn.disabled = false;
        }
      });
    } catch(err) {
      area.innerHTML = `<div class="error-state">${ICONS.error}<h3>เกิดข้อผิดพลาด</h3><p>${UTIL.escapeHtml(err.message)}</p></div>`;
    }
  }
};

// เพิ่ม helper แปลงไฟล์เป็น base64
UTIL.fileToBase64 = function(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result;
      // ตัด data URL prefix ออก
      const base64 = result.split(',')[1];
      resolve(base64);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
};

/* ============================================================
   INIT
   ============================================================ */
async function init() {
  // ตรวจสอบ session
  const hasSession = await AUTH.checkSession();
  if (hasSession) {
    ROUTER.navigate('dashboard');
  } else {
    UI.renderLogin();
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
